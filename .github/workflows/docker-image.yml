name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 最小权限基线：验证 job 只读；发布 job 单独提升 packages:write
permissions:
  contents: read

jobs:
  tests:
    name: pytest + compile smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: app/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r app/requirements.txt
        pip install pytest

    - name: Compile smoke (import all app modules)
      run: python -m compileall -q app

    - name: Run pytest
      working-directory: app
      run: python -m pytest ../tests -q

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: lowercase repository name
      run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ env.IMAGE_NAME }}:latest

  publish:
    name: Build & push to GHCR
    # 仅 main 分支 push（或手动触发）在测试与构建验证通过后发布；
    # PR 永远只跑 tests + docker-build，不污染 latest/sha 镜像。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [tests, docker-build]
    permissions:
      contents: read
      packages: write
    steps:
    - name: lowercase repository name
      run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ env.IMAGE_NAME }}:latest --tag ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Push the Docker image
      run: |
        docker push ghcr.io/${{ env.IMAGE_NAME }}:latest
        docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
